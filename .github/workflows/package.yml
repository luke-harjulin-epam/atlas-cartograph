name: Package

on:
  workflow_call:
    inputs:
      release-tag:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  package:
    name: APM bundle and install
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install checksum-pinned APM 0.30.0
        run: |
          tool_dir="$(mktemp -d "$RUNNER_TEMP/apm.XXXXXX")"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/microsoft/apm/releases/download/v0.30.0/apm-linux-x86_64.tar.gz \
            --output "$tool_dir/apm.tar.gz"
          printf '%s  %s\n' \
            8b84bebf19c350faf36d21aebb350dc656d04c0b7a1c2bf8ea35c0caa0e44bb9 \
            "$tool_dir/apm.tar.gz" | sha256sum --check --strict
          tar -xzf "$tool_dir/apm.tar.gz" -C "$tool_dir"
          echo "$tool_dir/apm-linux-x86_64" >> "$GITHUB_PATH"
      - name: Pack, install and exercise the shipped canvas
        env:
          TAG: ${{ inputs.release-tag }}
        run: npm run pack:release
      - name: Ensure packaging did not modify authored files
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cartograph-package
          path: build/release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
