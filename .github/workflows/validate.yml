name: Validate

on:
  workflow_call:
    inputs:
      release-tag:
        type: string
        default: ""
    outputs:
      version:
        value: ${{ jobs.version.outputs.version }}
      prerelease:
        value: ${{ jobs.version.outputs.prerelease }}

permissions:
  contents: read

jobs:
  version:
    name: Version alignment
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Check package and tag versions
        id: version
        env:
          TAG: ${{ inputs.release-tag }}
        run: npm run check:version
      - name: Require a release tag on reviewed main history
        if: inputs.release-tag != ''
        env:
          TAG: ${{ inputs.release-tag }}
        run: |
          test "$GITHUB_REF" = "refs/tags/$TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main

  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm run check:syntax
      - run: npm test
